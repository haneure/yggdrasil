---
- name: Check if Hermes is already installed
  ansible.builtin.stat:
    path: "/home/{{ hermes_user }}/.local/bin/hermes"
  register: hermes_bin
  become: true

- name: Install Hermes as hermes user
  ansible.builtin.shell: |
    set -e
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ hermes_user }}"
  when: not hermes_bin.stat.exists

- name: Ensure Hermes local bin is in bashrc
  ansible.builtin.lineinfile:
    path: "/home/{{ hermes_user }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"'
    create: true
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0644"
  become: true

- name: Create profile directories
  ansible.builtin.file:
    path: "{{ hermes_home }}/profiles/{{ item.name }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0700"
  loop: "{{ hermes_profiles }}"
  when: item.enabled | default(true)
  become: true

- name: Deploy shared yggdrasil AGENTS.md
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../agent_profiles/common/AGENTS.md"
    dest: "{{ yggdrasil_workspace }}/AGENTS.md"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0644"
  become: true

- name: Deploy profile SOUL.md files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.files.soul }}"
    dest: "{{ hermes_home }}/profiles/{{ item.name }}/SOUL.md"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0600"
  loop: "{{ hermes_profiles }}"
  when: item.enabled | default(true)
  become: true

- name: Deploy Hermes profile env files
  ansible.builtin.template:
    src: profile-env.j2
    dest: "{{ hermes_home }}/profiles/{{ item.name }}/.env"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0600"
  loop: "{{ hermes_profiles }}"
  loop_control:
    loop_var: profile
  when: profile.enabled | default(true)
  become: true

- name: Deploy Hermes profile config files
  ansible.builtin.template:
    src: profile-config.yaml.j2
    dest: "{{ hermes_home }}/profiles/{{ profile.name }}/config.yaml"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0600"
  loop: "{{ hermes_profiles }}"
  loop_control:
    loop_var: profile
  when: profile.enabled | default(true)
  become: true

- name: Ensure profile skills directories exist
  ansible.builtin.file:
    path: "{{ hermes_home }}/profiles/{{ item.name }}/skills"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: "0755"
  loop: "{{ hermes_profiles }}"
  when: item.enabled | default(true)
  become: true

- name: Deploy profile skills
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.files.skills_dir }}/"
    dest: "{{ hermes_home }}/profiles/{{ item.name }}/skills/"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: preserve
  loop: "{{ hermes_profiles }}"
  when:
    - item.enabled | default(true)
    - item.files.skills_dir is defined
  become: true

- name: Verify Hermes command
  ansible.builtin.shell: |
    set -e
    export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
    hermes --version
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ hermes_user }}"
  changed_when: false
